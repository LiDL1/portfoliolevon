<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Corner — Меликян Левон</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #3B3B3B;
      --white: #FFF1FF;
      --gray: #888;
      --border-thick: 7px solid var(--black);
      --font-main: 'Inter', sans-serif;
    }

    body {
      background: var(--white);
      color: var(--black);
      font-family: var(--font-main);
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ========= НАВИГАЦИЯ (как в about / contacts) ========= */
    nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 16px 24px;
      border-bottom: none; /* убираем стандартную линию, будет декор */
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 100;
    }

    .nav-title {
      font-weight: 700;
      font-size: 1.3rem;
      justify-self: start;
    }

    .nav-logo {
      justify-self: center;
    }
    .nav-logo img {
      height: 48px;
      width: auto;
      display: block;
      cursor: pointer;
    }

    .nav-right {
      justify-self: end;
    }

    /* Бургер-кнопка */
    .burger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    .burger span {
      width: 28px;
      height: 3px;
      background: var(--black);
      display: block;
      transition: 0.3s;
    }
    .burger.open span:nth-child(1) { transform: rotate(45deg) translateY(8px); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }

    /* FULLSCREEN БУРГЕР МЕНЮ */
    .burger-menu {
      position: fixed;
      inset: 0;
      background: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
      z-index: 200;
      gap: 8px;
    }
    .burger-menu.open {
      transform: translateX(0);
    }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .close-btn::before,
    .close-btn::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 3px;
      background: var(--black);
      top: 50%;
      left: 50%;
    }
    .close-btn::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .close-btn::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .menu-item {
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.5rem);
      border-bottom: 2px solid rgba(0,0,0,0.15);
      padding: 16px 0;
      text-decoration: none;
      color: var(--black);
      transition: opacity 0.2s;
      width: 100%;
      text-align: left;
    }
    .menu-item:hover {
      opacity: 0.5;
    }

    /* Декоративный элемент (линия из изображения) */
    .decor-line-img {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 0;
      line-height: 0;
    }
    .decor-line-img img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ========= ОСНОВНОЙ КОНТЕНТ ПРОЕКТА ========= */
    .project-container {
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 48px 32px;
      width: 100%;
    }

    /* сетка героя (две колонки) */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 64px;
    }
    .hero-grid img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* центральный текст — смещён вправо */
    .center-text {
      text-align: right;
      font-weight: 700;
      font-size: 1.6rem;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin: 48px 0;
      max-width: 900px;
      margin-left: auto;
      margin-right: 0;
    }

    /* блок текст + картинка */
    .text-image-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
      margin: 64px 0;
    }
    .text-image-block .description {
      font-weight: 700;
      font-size: 1.4rem;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    .text-image-block img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* две картинки в ряд */
    .two-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin: 64px 0;
    }
    .two-images img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    /* большая картинка на всю ширину */
    .full-image {
      margin: 64px 0;
    }
    .full-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* навигация между проектами — без border-top, с декором сверху */
    .project-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 64px 0 32px;
      font-weight: 700;
      font-size: 1.2rem;
      padding-top: 32px;
      position: relative;
    }
    /* декоративный элемент над навигацией */
    .nav-decor {
      margin-bottom: 24px;
    }
    .project-nav a {
      text-decoration: none;
      color: #8373F3;
      transition: opacity 0.2s;
      font-weight: 700;
      padding: 8px 12px;
    }
    .project-nav a:hover {
      opacity: 0.6;
      text-decoration: underline;
    }

    /* ========= ФУТЕР (как в about/contacts) ========= */
    footer {
      background: #0a0a0a;
      position: relative;
      padding: 56px 40px 48px;
      overflow: hidden;
      color: #f5f5f0;
    }
    footer::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url('img/footer.png');
      background-repeat: repeat;
      background-size: 42px;
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }
    footer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
      z-index: 0;
    }
    .footer-title {
      font-weight: 800;
      font-size: clamp(32px, 6vw, 54px);
      line-height: 1.2;
      margin-bottom: 44px;
      position: relative;
      z-index: 2;
      letter-spacing: -0.01em;
    }
    .footer-icons {
      display: flex;
      gap: 28px;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .footer-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      text-decoration: none;
      color: var(--white);
      transition: all 0.25s;
    }
    .footer-icon:hover {
      background: rgba(255,255,245,0.25);
      transform: translateY(-3px);
    }
    .footer-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--white);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .footer-icon:first-child svg circle:last-of-type {
      fill: var(--white);
      stroke: none;
    }

    /* ========= АДАПТИВНОСТЬ ========= */
    @media (max-width: 900px) {
      .project-container {
        padding: 32px 20px;
      }
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .text-image-block {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      .two-images {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .center-text {
        font-size: 1.3rem;
        margin: 32px 0;
        text-align: right;
      }
      .text-image-block .description {
        font-size: 1.2rem;
      }
      .nav-logo img {
        height: 38px;
      }
      .nav-title {
        font-size: 1rem;
      }
      footer {
        padding: 44px 28px 36px;
      }
    }

    @media (max-width: 560px) {
      .center-text {
        font-size: 1.1rem;
      }
      .text-image-block .description {
        font-size: 1rem;
      }
      .project-nav {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

<!-- FULLSCREEN БУРГЕР МЕНЮ (как в about) -->
<div class="burger-menu" id="burgerMenu">
  <button class="close-btn" onclick="toggleBurger()" aria-label="Закрыть меню"></button>
  <a class="menu-item" href="index.html">Главная</a>
  <a class="menu-item" href="about.html">Обо мне</a>
  <a class="menu-item" href="works.html">Работы</a>

<nav>

<!-- ДЕКОРАТИВНЫЙ ЭЛЕМЕНТ ВМЕСТО ЛИНИИ ПОД ХЭДЕРОМ (coffee-7.png) -->

<!-- ОСНОВНОЙ КОНТЕНТ ПРОЕКТА -->

    <div class="full-image">

  </div>
    <div class="full-image">

  <!-- ДЕКОРАТИВНЫЙ ЭЛЕМЕНТ ПЕРЕД НАВИГАЦИЕЙ (coffee-7.png) -->

  </div>

  <!-- навигация между проектами (без border-top, декор уже сверху) -->
  <div class="project-nav">
    <a href="project-4.html" aria-label="Предыдущий проект"> < Предыдущий </a>
    <a href="contacts.html">Связаться →</a>

</main>

<!-- ФУТЕР (как в about / contacts) -->
<footer>
  <p class="footer-title">Всегда готов<br>к сотрудничеству!</p>
  <div class="footer-icons">
    <a href="#" class="footer-icon" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" fill="none"/>
        <circle cx="12" cy="12" r="5" stroke="currentColor" fill="none"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="#" class="footer-icon" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="3" stroke="currentColor" fill="none"/>
        <line x1="7" y1="10" x2="7" y2="17" stroke="currentColor"/>
        <line x1="7" y1="7" x2="7" y2="7.5" stroke="currentColor" stroke-width="2.5"/>

      </svg>

    <a href="#" class="footer-icon" aria-label="Email">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" fill="none"/>
        <polyline points="2,4 12,13 22,4" stroke="currentColor" fill="none"/>
      </svg>
    </a>
  </div>
</footer>

<script>
  let isOpen = false;
  function toggleBurger() {
    isOpen = !isOpen;
    const menu = document.getElementById('burgerMenu');
    const burgerBtn = document.getElementById('burgerBtn');
    if (menu) menu.classList.toggle('open', isOpen);
    if (burgerBtn) burgerBtn.classList.toggle('open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }

  document.querySelectorAll('.menu-item').forEach(link => {
    link.addEventListener('click', () => {
      if (isOpen) toggleBurger();
    });
  });
</script>
</body>
</html>
