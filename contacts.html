<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты — Меликян Левон</title>

<!-- Шрифты Inter: Regular, Bold, Black -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --black: #0a0a0a;
  --white: #f5f5f0;
  --border-thick: 7px solid var(--black);
  --font-main: 'Inter', sans-serif;
}

body {
  font-family: var(--font-main);
  background: var(--white);
  color: var(--black);
  font-weight: 400;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ========= НАВИГАЦИЯ (полностью как в about.html) ========= */
nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 16px 24px;
  border-bottom: var(--border-thick);
  position: sticky;
  top: 0;
  background: var(--white);
  z-index: 100;
}

.nav-title {
  font-weight: 700;
  font-size: 1.3rem;
  justify-self: start;
}

.nav-logo {
  justify-self: center;
}
.nav-logo img {
  height: 48px;
  width: auto;
  display: block;
}

.nav-right {
  justify-self: end;
}

/* Бургер-кнопка */
.burger {
  display: flex;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
}
.burger span {
  width: 28px;
  height: 3px;
  background: var(--black);
  display: block;
  transition: 0.3s;
}
.burger.open span:nth-child(1) { transform: rotate(45deg) translateY(8px); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }

/* Fullscreen меню */
.burger-menu {
  position: fixed;
  inset: 0;
  background: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 40px;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
  z-index: 200;
  gap: 8px;
}
.burger-menu.open { transform: translateX(0); }

.close-btn {
  position: absolute;
  top: 24px; right: 28px;
  width: 36px; height: 36px;
  background: none; border: none;
  cursor: pointer;
}
.close-btn::before,
.close-btn::after {
  content: '';
  position: absolute;
  width: 28px; height: 3px;
  background: var(--black);
  top: 50%; left: 50%;
}
.close-btn::before { transform: translate(-50%, -50%) rotate(45deg); }
.close-btn::after  { transform: translate(-50%, -50%) rotate(-45deg); }

.menu-item {
  font-weight: 700;
  font-size: clamp(2rem, 7vw, 3.5rem);
  border-bottom: 2px solid rgba(0,0,0,0.15);
  padding: 16px 0;
  text-decoration: none;
  color: var(--black);
  transition: opacity 0.2s;
}
.menu-item:hover { opacity: 0.5; }

/* ========= ОСНОВНОЙ КОНТЕНТ (контакты по центру) ========= */
.contacts-content {
  flex: 1;
  max-width: 1200px;
  width: 100%;
  margin: auto 40px;
  padding: 120px 0px;
  text-align: left;          /* горизонтальное центрирование текста и инлайн-блоков */
}

.contact-line {
  font-family: var(--font-main);
  font-size: 2rem;
  line-height: 1.4;
  margin-bottom: 32px;
}

/* Inter Black для меток */
.contact-label {
  font-weight: 900;
  letter-spacing: -0.02em;
}

/* Inter Bold для значений */
.contact-value {
  font-weight: 700;
  letter-spacing: -0.01em;
}

.contact-line a {
  text-decoration: none;
  color: var(--black);
  border-bottom: 2px solid transparent;
  transition: border-color 0.2s;
}

.contact-line a:hover {
  border-bottom-color: var(--black);
}

/* ========= ФУТЕР (полностью как в about.html: текстура, иконки, стиль) ========= */
footer {
  background: var(--black);
  position: relative;
  padding: 56px 40px 48px;
  border-top: var(--border-thick);
  overflow: hidden;
  color: var(--white);
}

/* Фоновая текстура (изображение/паттерн) */
footer::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url('img/footer.png');
  background-repeat: repeat;
  background-size: 42px;
  opacity: 0.22;
  pointer-events: none;
  z-index: 0;
}

/* Полупрозрачный градиент для читаемости текста */
footer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
  z-index: 0;
}

.footer-title {
  font-weight: 800;
  font-size: clamp(32px, 6vw, 54px);
  line-height: 1.2;
  margin-bottom: 44px;
  position: relative;
  z-index: 2;
  letter-spacing: -0.01em;
}

.footer-icons {
  display: flex;
  gap: 28px;
  align-items: center;
  position: relative;
  z-index: 2;
}

.footer-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  text-decoration: none;
  color: var(--white);
  transition: all 0.25s;
}
.footer-icon:hover {
  background: rgba(255,255,245,0.25);
  transform: translateY(-3px);
}
.footer-icon svg {
  width: 26px;
  height: 26px;
  stroke: var(--white);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* Корректировка иконки Instagram (заливка кружка) */
.footer-icon:first-child svg circle:last-of-type {
  fill: var(--white);
  stroke: none;
}

/* ========= АДАПТИВ ========= */
@media (max-width: 768px) {
  .contacts-content {
    padding: 60px 24px;
  }
  .contact-line {
    font-size: 1.4rem;
  }
  footer {
    padding: 44px 28px 36px;
  }
  .footer-icons {
    gap: 20px;
  }
  .logo-img {
    height: 38px;
  }
  .nav-title {
    font-size: 1rem;
  }
}

@media (max-width: 480px) {
  .contact-line {
    font-size: 1.2rem;
    word-break: break-word;
  }
}
</style>
</head>
<body>

<!-- FULLSCREEN МЕНЮ (бургер) -->
<div class="burger-menu" id="burgerMenu">
  <button class="close-btn" onclick="toggleBurger()" aria-label="Закрыть"></button>
  <a class="menu-item" href="index.html">Главная</a>
  <a class="menu-item" href="about.html">Обо мне</a>
  <a class="menu-item" href="works.html">Работы</a>
  <a class="menu-item" href="contacts.html">Контакты</a>
</div>

<!-- НАВИГАЦИЯ (как на странице «Обо мне») -->
<nav>
  <span class="nav-title">Контакты</span>
  <a href="index.html" class="nav-logo">
    <img src="img/Лого.png" alt="Логотип">
  </a>
  <div class="nav-right">
    <button class="burger" id="burgerBtn" onclick="toggleBurger()" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ОСНОВНОЙ БЛОК С КОНТАКТАМИ (по центру) -->
<div class="contacts-content">
  <!-- Почта -->
  <div class="contact-line">
    <span class="contact-label">почта:</span>
    <span class="contact-value">
      <a href="mailto:melikianlevon@icloud.com">melikianlevon@icloud.com</a>
    </span>
  </div>

  <!-- Telegram -->
  <div class="contact-line">
    <span class="contact-label">telegram:</span>
    <span class="contact-value">
      <a href="https://t.me/ldlka" target="_blank" rel="noopener noreferrer">@ldlka</a>
    </span>
  </div>
</div>

<!-- ФУТЕР (полностью как в about.html: текстура, иконки) -->
<footer>
  <p class="footer-title">Всегда готов<br>к сотрудничеству!</p>
  <div class="footer-icons">
    <!-- Instagram -->
    <a href="#" class="footer-icon" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" fill="none"/>
        <circle cx="12" cy="12" r="5" stroke="currentColor" fill="none"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <!-- LinkedIn -->
    <a href="#" class="footer-icon" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="3" stroke="currentColor" fill="none"/>
        <line x1="7" y1="10" x2="7" y2="17" stroke="currentColor"/>
        <line x1="7" y1="7" x2="7" y2="7.5" stroke="currentColor" stroke-width="2.5"/>
        <path d="M11 10v7M11 13a3 3 0 0 1 6 0v4" stroke="currentColor" fill="none"/>
      </svg>
    </a>
    <!-- Email -->
    <a href="#" class="footer-icon" aria-label="Email">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" fill="none"/>
        <polyline points="2,4 12,13 22,4" stroke="currentColor" fill="none"/>
      </svg>
    </a>
  </div>
</footer>

<script>
let isOpen = false;
function toggleBurger() {
  isOpen = !isOpen;
  document.getElementById('burgerMenu').classList.toggle('open', isOpen);
  document.getElementById('burgerBtn').classList.toggle('open', isOpen);
  document.body.style.overflow = isOpen ? 'hidden' : '';
}
document.querySelectorAll('.menu-item').forEach(link => {
  link.addEventListener('click', () => { if (isOpen) toggleBurger(); });
});
</script>
</body>
</html>
